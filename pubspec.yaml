name: vehicleguard
description: Real-Time Vehicle Theft Monitoring and Alert System Using Ad Hoc Networks
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  flutter_local_notifications: ^17.1.2
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  image_picker: ^1.1.2
  connectivity_plus: ^6.0.5
  vigilink_mesh_transport:
    path: packages/vigilink_mesh_transport
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_foreground_task: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: false
